  <title>LLM Serving 实战教程</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="基于《Hands-On LLM Serving and Optimization》的大模型推理服务自学教程：原理推导、交互组件、手写推理引擎与 2026 年生产实践" />
  <meta name="color-scheme" content="light dark" />
  <script>
    // 在首次绘制前确定配色，避免闪烁。优先用户选择，其次跟随系统
    (function () {
      var t = null;
      try { t = localStorage.getItem('llmopt-theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') {
        t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <!-- 所有依赖都托管在仓库内（assets/vendor），不依赖外部 CDN 与网络字体 -->
  <link rel="stylesheet" href="assets/vendor/docsify-vue.css" />

  <link rel="stylesheet" href="assets/custom.css?v=20261030a" />
</head>
<body>
  <div id="app">加载中…</div>

  <script>
    var PROGRESS_KEY = 'llmopt-progress-v1';
    // 2026-10 调整过第 0、1 部分的顺序，旧的进度记录按新路径迁移
    var ROUTE_MOVES = {
      'stage1/01-transformer-anatomy': 'stage0/02-transformer-anatomy',
      'stage1/02-autoregressive-walkthrough': 'stage0/03-autoregressive-generation',
      'stage1/03-kv-cache-prefill-decode': 'stage0/04-kv-cache-prefill-decode',
      'stage0/02-gpu-specs': 'stage0/05-gpu-specs',
      'stage0/03-memory-budget': 'stage0/06-memory-budget',
      'stage0/04-roofline': 'stage0/07-roofline',
      'stage0/05-metrics': 'stage0/08-metrics',
      'stage1/04-serving-from-scratch': 'stage1/01-serving-from-scratch',
      'stage1/05-continuous-batching': 'stage1/02-continuous-batching',
      'stage1/06-vllm-internals': 'stage1/03-paged-attention-vllm',
      'stage1/07-prefix-caching': 'stage1/04-prefix-caching',
      'stage1/08-framework-comparison': 'stage1/05-framework-comparison',
      'stage2/04-smoothquant': 'stage2/04-activation-quant',
      'stage2/05-fp8-int4-kv-quant': 'stage2/05-kv-cache-quant',
      'stage2/06-distillation-pruning': 'stage2/08-distillation-pruning',
      'stage2/07-quant-kernels': 'stage2/06-quant-kernels',
    };
    // 旧链接跳转到新路径
    function redirectMovedRoute() {
      var m = location.hash.match(/^#\/([^?]+?)(\.md)?(\?.*)?$/);
      if (m && ROUTE_MOVES[m[1]]) location.replace('#/' + ROUTE_MOVES[m[1]] + (m[3] || ''));
    }
    redirectMovedRoute();
    window.addEventListener('hashchange', redirectMovedRoute);

    function loadProgress() {
      var p = {};
      try { p = JSON.parse(localStorage.getItem(PROGRESS_KEY) || '{}'); } catch (e) { return {}; }
      try {
        if (!localStorage.getItem('llmopt-progress-migrated-2')) {
          var out = {};
          Object.keys(p).forEach(function (k) { out[ROUTE_MOVES[k] || k] = p[k]; });
          p = out;
          localStorage.setItem(PROGRESS_KEY, JSON.stringify(p));
          localStorage.setItem('llmopt-progress-migrated-2', '1');
        }
      } catch (e) {}
      return p;
    }
    function saveProgress(p) {
      try { localStorage.setItem(PROGRESS_KEY, JSON.stringify(p)); } catch (e) {}
    }

    window.$docsify = {
      name: 'LLM Serving 实战教程',
      nameLink: '#/',
      homepage: 'README.md',
      coverpage: false,
      loadNavbar: true,
      mergeNavbar: true,
      loadSidebar: true,
      alias: {
        '/.*/_sidebar.md': '/_sidebar.md',
        '/.*/_navbar.md': '/_navbar.md',
      },
      subMaxLevel: 2,
      maxLevel: 4,
      auto2top: true,
      topMargin: 72,
      relativePath: false,
      notFoundPage: '_404.md',
      executeScript: true,

      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: '搜索章节、概念或参数',
        noData: '没有找到相关内容',
        depth: 3,
      },
      copyCode: { buttonText: '复制', errorText: '复制失败', successText: '已复制' },
      pagination: { previousText: '上一节', nextText: '下一节', crossChapter: true, crossChapterText: true },
      count: {
        countable: true, position: 'top', margin: '0', float: 'right', fontsize: '0.8em',
        color: 'var(--ink-3)', language: 'chinese', localization: { words: ' 字', minute: ' 分钟' }, isExpected: true,
      },
      tabs: { persist: true, sync: true, theme: 'classic', tabComments: true, tabHeadings: true },
      'flexible-alerts': {
        style: 'flat',
        note: { label: '说明' },
        tip: { label: '技巧' },
        warning: { label: '注意' },
        attention: { label: '易错点' },
      },
      markdown: {
        renderer: {
          code: function (code, lang) {
            if (lang === 'mermaid') return '<div class="mermaid" data-src="' + encodeURIComponent(code) + '">' + code + '</div>';
            return this.origin.code.apply(this, arguments);
          },
        },
      },

      plugins: [
        // 主页使用独立版式；其余页面在标题下方显示"本节对应书中…"等元信息
        function (hook, vm) {
          hook.doneEach(function () {
            var isHome = vm.route.path === '/' || vm.route.path === '/README';
            document.body.classList.toggle('is-home', isHome);
          });
        },

        // Mermaid 与交互组件
        function (hook) {
          hook.doneEach(function () {
            if (window.mermaid) {
              try { window.mermaid.run({ querySelector: '.markdown-section .mermaid' }); } catch (e) {}
            }
            if (window.LLMWidgets) window.LLMWidgets.mountAll();
          });
        },

        // 学习进度：页底打卡、侧边栏标记、每部分完成数
        function (hook, vm) {
          function routeOf(href) {
            return (href || '').replace(/^#\//, '').replace(/\.md$/, '');
          }
          function paintSidebar() {
            var p = loadProgress();
            document.querySelectorAll('.sidebar-nav a').forEach(function (a) {
              var raw = a.getAttribute('href') || '';
              if (raw.indexOf('?id=') !== -1) return;
              a.classList.toggle('is-cleared', !!p[routeOf(raw)]);
            });
            document.querySelectorAll('.sidebar-nav > ul > li').forEach(function (li) {
              var head = li.querySelector(':scope > p, :scope > strong');
              var links = li.querySelectorAll(':scope > ul > li > a');
              if (!head || !links.length) return;
              var done = 0;
              links.forEach(function (a) { if (p[routeOf(a.getAttribute('href'))]) done++; });
              var tag = head.querySelector('.part-progress');
              if (!tag) {
                tag = document.createElement('span');
                tag.className = 'part-progress';
                head.appendChild(tag);
              }
              tag.textContent = done + '/' + links.length;
              tag.classList.toggle('is-full', done === links.length);
            });
          }
          window.LLMProgress = { load: loadProgress, paint: paintSidebar };

          hook.afterEach(function (html) {
            var path = vm.route.path.replace(/^\//, '');
            if (!path || path === 'README') return html;
            var done = !!loadProgress()[path];
            return html +
              '<div class="clear-box"><button type="button" class="clear-btn' + (done ? ' done' : '') +
              '" data-path="' + path + '" aria-pressed="' + done + '">' +
              (done ? '已完成本节' : '标记本节已完成') + '</button></div>';
          });
          hook.doneEach(function () {
            var btn = document.querySelector('.clear-btn');
            if (btn) {
              btn.onclick = function () {
                var p = loadProgress(), k = btn.dataset.path;
                if (p[k]) delete p[k]; else p[k] = Date.now();
                saveProgress(p);
                var done = !!p[k];
                btn.classList.toggle('done', done);
                btn.setAttribute('aria-pressed', done);
                btn.textContent = done ? '已完成本节' : '标记本节已完成';
                paintSidebar();
              };
            }
            paintSidebar();
          });
        },

        // 配色切换：固定在右上角，不依赖导航栏（导航栏会在加载 _navbar.md 后整体重绘）
        function (hook) {
          hook.doneEach(function () {
            if (document.querySelector('.theme-toggle')) return;
            var btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'theme-toggle';
            function label() {
              var dark = document.documentElement.getAttribute('data-theme') === 'dark';
              btn.innerHTML = dark
                ? '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg><span>浅色</span>'
                : '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.6A8.2 8.2 0 0 1 9.4 4a8.2 8.2 0 1 0 10.6 10.6z"/></svg><span>深色</span>';
              btn.setAttribute('aria-label', dark ? '切换到浅色' : '切换到深色');
              btn.title = btn.getAttribute('aria-label');
            }
            label();
            btn.refresh = label;
            btn.onclick = function () {
              var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
              window.LLMTheme.set(next);
            };
            document.body.appendChild(btn);
          });
        },

        function (hook) {
          hook.afterEach(function (html) {
            return html + '<footer class="site-footer">内容基于 <em>Hands-On LLM Serving and Optimization</em>（O\'Reilly）与公开的推理框架源码、论文整理。' +
              '<a href="https://github.com/zrpxx/hands-on-llm-serving-opt" target="_blank" rel="noopener">在 GitHub 上查看源文件</a></footer>';
          });
        },
      ],
    };
  </script>

  <script src="assets/vendor/mermaid.min.js"></script>
  <script>
    (function () {
      function initMermaid() {
        var css = getComputedStyle(document.documentElement);
        var v = function (n) { return css.getPropertyValue(n).trim(); };
        var dark = document.documentElement.getAttribute('data-theme') === 'dark';
        mermaid.initialize({
          startOnLoad: false,
          theme: 'base',
          darkMode: dark,
          fontFamily: v('--font-body'),
          themeVariables: {
            fontSize: '14px',
            background: v('--paper'),
            primaryColor: v('--prefill-soft'),
            primaryBorderColor: v('--prefill'),
            primaryTextColor: v('--ink'),
            secondaryColor: v('--decode-soft'),
            secondaryBorderColor: v('--decode'),
            tertiaryColor: v('--paper-2'),
            tertiaryBorderColor: v('--rule-strong'),
            lineColor: v('--ink-3'),
            textColor: v('--ink'),
            clusterBkg: v('--paper-2'),
            clusterBorder: v('--rule-strong'),
            noteBkgColor: v('--decode-soft'),
            noteBorderColor: v('--decode'),
            noteTextColor: v('--ink'),
            actorBkg: v('--prefill-soft'),
            actorBorder: v('--prefill'),
            actorTextColor: v('--ink'),
            signalColor: v('--ink-2'),
            signalTextColor: v('--ink'),
            labelTextColor: v('--ink'),
            loopTextColor: v('--ink'),
            edgeLabelBackground: v('--paper'),
            taskBkgColor: v('--prefill-soft'),
            taskBorderColor: v('--prefill'),
            taskTextColor: v('--ink'),
            taskTextDarkColor: v('--ink'),
            taskTextOutsideColor: v('--ink'),
            critBkgColor: v('--decode-soft'),
            critBorderColor: v('--decode'),
            gridColor: v('--rule'),
            sectionBkgColor: v('--paper-2'),
            altSectionBkgColor: v('--paper'),
          },
        });
      }
      initMermaid();

      // 无刷新切换配色：重设 CSS 变量后，重绘 Mermaid 图与交互组件（它们在绘制时读取颜色）
      // 用户没有手动选择时，跟随系统配色变化
      if (window.matchMedia) {
        var mq = window.matchMedia('(prefers-color-scheme: dark)');
        var onChange = function (e) {
          var saved = null;
          try { saved = localStorage.getItem('llmopt-theme'); } catch (err) {}
          if (saved) return;
          window.LLMTheme.set(e.matches ? 'dark' : 'light', true);
        };
        if (mq.addEventListener) mq.addEventListener('change', onChange);
      }

      window.LLMTheme = {
        set: function (theme, fromSystem) {
          document.documentElement.setAttribute('data-theme', theme);
          if (!fromSystem) { try { localStorage.setItem('llmopt-theme', theme); } catch (e) {} }
          var tb = document.querySelector('.theme-toggle');
          if (tb && tb.refresh) tb.refresh();
          initMermaid();
          var nodes = document.querySelectorAll('.markdown-section .mermaid[data-src]');
          nodes.forEach(function (n) {
            n.removeAttribute('data-processed');
            n.innerHTML = decodeURIComponent(n.getAttribute('data-src'));
          });
          if (nodes.length) { try { mermaid.run({ nodes: nodes }); } catch (e) {} }
          if (window.LLMWidgets && window.LLMWidgets.remountAll) window.LLMWidgets.remountAll();
        },
      };
    })();
  </script>
